name: Vallecito Storm Watch

# Three times a day, not hourly. A storm five days out does not change
# meaningfully between 9am and 10am, and checking constantly only raises the
# chance of firing on a model wobble.
on:
  schedule:
    - cron: "10 17 * * *"   # ~10:10 MST / 11:10 MDT
    - cron: "10 22 * * *"   # ~15:10 / 16:10
    - cron: "10 03 * * *"   # ~20:10 / 21:10
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        required: false
        default: "true"

concurrency:
  group: govallecito-bot-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Look for a storm in the day 2-5 window
        env:
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CDOT_API_KEY: ${{ secrets.CDOT_API_KEY }}
          WX_FIRST_30_DAYS: ${{ vars.WX_FIRST_30_DAYS }}
          WX_SITE_DIR: ${{ vars.WX_SITE_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/wx/run_storm_watch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storm-watch-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit state
        if: always()
        run: |
          git config user.name  "govallecito-wx"
          git config user.email "bot@govallecito.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "wx: storm watch state [skip ci]"
          git push || echo "nothing to push"
