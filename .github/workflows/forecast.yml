name: Vallecito Forecast

# ---------------------------------------------------------------------------
# SECRET TO CREATE: HEALTHCHECK_URL_FORECAST
#
# A healthchecks.io ping URL for this workflow. The heartbeat step at the very
# bottom of the job curls it, and ONLY on success. That inverts the alarm: you
# stop getting an email because the job stopped running or went red, instead of
# hoping a failure email arrives. Create one check at healthchecks.io per
# workflow, set its period + grace to a little more than this schedule's gap,
# and store its ping URL as the repo secret named above.
#
# Until that secret exists the heartbeat step skips itself, so this workflow
# stays green with nothing configured.
# ---------------------------------------------------------------------------

# ARCHITECTURE, 2026-09-29: the morning post is driven by an EXTERNAL
# trigger. Cron is the backup path, not the primary one.
#
# Primary: the Cloudflare Worker in trigger/ (wx-morning-trigger, deployed
# 2026-09-29, first live dispatch 2026-09-30 05:01). It fires on the hour
# across 11-16Z, resolves the Denver clock in code, and at local 05, 06, 07
# and 08 dispatches this workflow with
#   {"ref":"main","inputs":{"slot":"","dry_run":"false"}}
# unless site/weather/feed.json already has today's post. At local 09 it pings
# its healthcheck's /fail if there is still no post. workflow_dispatch does not
# go through GitHub's scheduler and starts within seconds. `slot` is
# deliberately empty: a forced slot skips the clock check in determine_slot(),
# while an empty one takes the normal window check and the ledger, so later
# attempts on a day that already posted (or was held) are no-ops.
#
# Backup: the three cron lines below. They are safe to keep because
# state/post_ledger.json makes a second run for the same slot a no-op.
#
# WHY: the problem is delivery LATENCY. Measured 2026-09-29: verify.yml (one
# cron a day, same concurrency group) delivered 29 of 29 days with a median
# start 199 minutes late (range 117-348). engagement-check.yml fires at 10:00Z
# and starts 13:18Z-17:55Z. wx-selftest runs about 5 hours late every Monday.
# For this workflow, 105 of 609 scheduled slots executed over 11 days, and
# only 11 of those 105 started within 2 minutes of their scheduled minute.
# Late runs are discarded by run_forecast.py's own 04:00-09:00 Mountain window
# check; a 10:07 arrival (2026-09-29) misses any sane window. GitHub places the
# drift in a load-balancing layer upstream of the runner queue, so a
# self-hosted runner would not help either.
#
# CORRECTIONS to earlier versions of this comment:
#   - "Delivery is capped around 10 a day": wrong. Runs arrive, late.
#   - "The ones that do are punctual, median 4.1 minutes from their slot":
#     an aliasing artifact. With slots every 15 minutes, a run hours late is
#     still always within 7.5 minutes of SOME slot, so distance-to-nearest-slot
#     cannot see lateness. Only a workflow with one cron a day (verify.yml)
#     measures it unambiguously, and that one is 2-6 hours late.
#   - Concurrency-group eviction: investigated and cleared. verify.yml shares
#     govallecito-bot-state and delivers every day.
#
# Do not: add or retune cron entries, widen the window further, stand up a
# self-hosted runner, or change the concurrency group.
#
# The clock is still checked in America/Denver inside run_forecast.py, so the
# schedule survives both DST transitions with no YAML edits.
#
# 10:00-15:00 UTC covers 04:00-09:00 local in BOTH MDT (UTC-6) and MST (UTC-7).
# Exactly one hour each way is dead, and no single range can avoid it: at UTC-6
# the 15Z slot is 09 local, past the window close, and at UTC-7 the 10Z slot is
# 03 local, before it opens. That is the price of one cron expression serving
# both offsets. Narrowing to 10-14 looks tidier today and is wrong: it drops 08
# local the day MST starts, and takes with it the only morning slot at UTC-6
# that can reach _report_miss_if_needed, which fires only at or past hour 9.
# This range and SCHOOL_CALL_WINDOW in scripts/wx/constants.py must move
# together. Pinned in both directions by tests/test_scheduling.py.
on:
  schedule:
    - cron: "5,20,35,50 10-15 * * *"   # morning window, both DST offsets
    - cron: "5,35 1-6 * * *"           # evening window, both DST offsets
    - cron: "45 * * * *"               # hourly heartbeat: miss alarm, storm work
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot"
        required: false
        type: choice
        options: ["", school_call, evening, storm_setup, totals, life_safety]
      dry_run:
        description: "Dry run (compose and review, publish nothing)"
        required: false
        # "false", not "true": the REST dispatch endpoint applies DECLARED
        # defaults to any input it is not sent. With "true" here, an external
        # trigger that omitted dry_run would compose, pass the review panel,
        # log MAGISTRATE APPROVED, publish nothing, and show green. The Worker
        # also sends dry_run explicitly; this is the second brace.
        default: "false"

# Shares a lock with the existing bot's workflows -- they all write state files
# and letting two run at once is worse than a delay.
concurrency:
  group: govallecito-bot-state
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # Lifted to job level purely so the heartbeat step's `if` can test
    # it. A step-level `if` cannot read the `secrets` context at all
    # (GitHub rejects the file: "Unrecognized named-value: 'secrets'"),
    # but it can read `env`.
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL_FORECAST }}
    # 30, not 15: the review panel adds up to three rounds of four model
    # calls (fact checker, editor, magistrate, reviser) to a morning run.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write          # review-notification path
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the commit this run was queued on. GitHub
          # releases delayed scheduled runs in batches; they run one at a time
          # (the concurrency group) but each used to check out the SHA from
          # when it was queued, so the second started without the first one's
          # state commit and its push was always rejected. On 2026-10-03 the
          # rebase that followed conflicted in state/logs/ and the run failed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The conditions bot's workflows already do this and mine did not, which
      # is why the forecaster died at import on `from PIL import Image` while
      # the self-test -- which imports no Pillow -- passed every time.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # For tools/draft-lint.mjs. Zero npm dependencies, so no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the forecaster
        env:
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN }}
          FORCE_SLOT: ${{ inputs.slot }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_GROUP_ID: ${{ vars.FB_GROUP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CDOT_API_KEY: ${{ secrets.CDOT_API_KEY }}
          WX_MODEL: ${{ vars.WX_MODEL }}
          WX_FIRST_30_DAYS: ${{ vars.WX_FIRST_30_DAYS }}
          # Comma-separated slots whose panel-approved post also goes to the
          # Facebook Page on its own (run_forecast._fb_auto_slots). Unset or
          # empty = none; Facebook is then reached only by facebook-post.yml.
          # Independent of DRY_RUN, which also gates four other posting paths.
          WX_FB_AUTO_SLOTS: ${{ vars.WX_FB_AUTO_SLOTS }}
          # Review panel (scripts/wx/review_panel.py). On by default: two
          # reviewers and a magistrate replace the human for the WEBSITE only.
          # Facebook and email still wait for WX_FIRST_30_DAYS=false.
          WX_REVIEW_PANEL: ${{ vars.WX_REVIEW_PANEL }}
          WX_REVIEW_MODEL: ${{ vars.WX_REVIEW_MODEL }}
          WX_PANEL_MAX_ROUNDS: ${{ vars.WX_PANEL_MAX_ROUNDS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WX_SITE_DIR: ${{ vars.WX_SITE_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state state/logs
          # Capture the run's own output where it can be read from a plain
          # clone. GitHub's raw logs sit behind short-lived signed URLs, so an
          # import-time failure -- which happens before any in-script handler
          # exists -- was otherwise effectively unreadable.
          #
          # The dated file is the fix for the second half of that. This job
          # runs about 56 times a day and `tee` truncates, so by the time
          # anyone looked at last-run-forecast.log the run that actually had
          # something to say had been overwritten many times over, including
          # every run that failed to open a review issue. The day's log now
          # accumulates under state/logs/ and survives; the flat file stays as
          # the convenient "what happened last" pointer everything else, and
          # the miss report, already names.
          DAY_LOG="state/logs/forecast-$(TZ=America/Denver date +%Y-%m-%d).log"
          set +e
          python scripts/wx/run_forecast.py 2>&1 | tee state/last-run-forecast.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> state/last-run-forecast.log
          {
            echo "=== $(TZ=America/Denver date --iso-8601=seconds) run ${GITHUB_RUN_ID} ==="
            cat state/last-run-forecast.log
            echo
          } >> "$DAY_LOG"
          # Keep a fortnight. Long enough to review a bad week, short enough
          # that the repo does not grow a log directory nobody prunes.
          ls -1t state/logs/forecast-*.log 2>/dev/null | tail -n +15 | xargs -r rm -f
          exit $code

      # Deterministic lint of a held draft, prepended to the review issue the
      # forecaster just opened and labelled lint-clean or lint-failed. Does
      # nothing on runs that held no draft. Never fails the job and never
      # suppresses the issue: a bad draft is still shown, labelled bad.
      - name: Lint the held draft into its review issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/lint-review-issue.sh state/last-run-forecast.log

      # Always uploaded, including on a BLOCK or REVIEW verdict -- the held
      # draft is the thing you most need to read when the gate stops something.
      - name: Upload draft and bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit state
        if: always()
        run: |
          git config user.name  "govallecito-wx"
          git config user.email "bot@govallecito.com"
          # site/ as well as state/: the forecaster writes the website's
          # content into this repo's own tree, so publishing to govallecito.com
          # is this push and needs no second repository's credential. The site
          # build reads site/weather/feed.json from raw.githubusercontent.
          git add state/ site/ || true
          git diff --staged --quiet && { echo "no state change"; exit 0; }
          git commit -m "wx: update forecast state [skip ci]"
          # More attempts a day means more chances two runs finish close
          # together and race on the push. A rejected push used to be swallowed
          # by `|| echo`, which silently lost the ledger entry and would let the
          # same morning post twice.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($attempt/5)"
            # A rebase that conflicts leaves the checkout detached mid-rebase,
            # and every later attempt then fails on that instead of retrying.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "::error::could not push state after 5 attempts"
          exit 1

      # A static site does not know the feed changed. This is the only piece
      # of the site path that needs a secret, and it is a build hook URL, which
      # can start a build and do nothing else. Netlify: Site settings > Build
      # hooks. Cloudflare Pages: Settings > Builds > Deploy hooks. If it is not
      # set, the site simply picks the post up on its next build.
      - name: Ask the site to rebuild
        if: always()
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK not set; skipping rebuild ping."
            echo "The site will pick up new forecasts on its next build."
            exit 0
          fi
          if git diff --quiet HEAD~1 -- site/ 2>/dev/null; then
            echo "site/ unchanged this run; no rebuild needed."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE_DEPLOY_HOOK")
          echo "deploy hook responded $code"
          # A failed rebuild ping must never fail the forecast: the post is
          # already committed and the next build will collect it.
          [ "$code" -ge 200 ] && [ "$code" -lt 400 ] || echo "::warning::deploy hook returned $code"


      # An absent secret makes the heartbeat below skip itself, which makes an
      # unmonitored workflow look exactly like a healthy one. That is how the
      # forecaster held every draft from 2026-09-19 to 2026-09-26 with nothing
      # anywhere saying so. This says it, in every run, so the gap shows up in
      # the run list instead of being silent.
      #
      # Deliberately BEFORE the heartbeat, so that step keeps its "last step"
      # guarantee. The two can never both run: this one fires only when the
      # secret is missing, the heartbeat only when it is present.
      - name: Heartbeat NOT configured
        if: always() && env.HEALTHCHECK_URL == ''
        run: |
          echo "::warning title=No forecast heartbeat::HEALTHCHECK_URL_FORECAST is not set. \
          Nothing will alert if this workflow stops running or starts failing. \
          Create a check at healthchecks.io and store its ping URL as the repo \
          secret HEALTHCHECK_URL_FORECAST (see the comment at the top of this file)."

      # Heartbeat -- MUST stay the last step in this job.
      #
      # `if: success()` is the whole point: it does not run when any earlier
      # step failed, and it obviously does not run when the schedule never
      # fires at all. healthchecks.io then emails on the MISSING ping. This is
      # the only signal that distinguishes "healthy and quiet" from "dead and
      # quiet" -- GitHub sends no email for a schedule that simply stopped.
      #
      # The `env.HEALTHCHECK_URL != ''` half only gates on the secret being
      # configured, not on the result: curl runs with -f, so once it is set a
      # non-2xx ping response fails this step and the job goes red.
      - name: Heartbeat (healthchecks.io)
        if: success() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL"


